[project]
name = "psi-server"
version = "0.1.0"
description = "PSI 进销存系统的后端 API"
license = "Apache-2.0"
authors = [{ name = "智创新途-石生" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "pwdlib[argon2]>=0.2,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.urls]
Repository = "https://github.com/dnmy-geo/PSI"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
